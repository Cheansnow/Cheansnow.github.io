info:
  title: Cheansnow
  subtitle:
  author: Cheansnow
  url: https://cheansnow.github.io

defaults:
  favicon: /images/redefine-favicon.svg
  logo: /images/redefine-logo.svg
  avatar: /images/redefine-avatar.svg

colors:
  primary: "#A31F34"
  secondary:
  default_mode: light

global:
  content_max_width: 1100px
  sidebar_width: 230px
  hover:
    shadow: true
    scale: true
  scroll_progress:
    bar: true
    percentage: true
  single_page: true
  preloader:
    enable: true
    custom_message: Cheansnow
  side_tools:
    gear_rotation: true
    auto_expand: false
  website_counter:
    enable: false
  open_graph:
    enable: true
    image: /images/redefine-og.webp

home_banner:
  enable: true
  style: fixed
  title: Cheansnow
  subtitle:
    text:
      - 在这里填写首页副标题
      - 支持多条文字循环显示
    typing_speed: 95
    backing_speed: 60
    starting_delay: 450
    backing_delay: 1500
    loop: false
    smart_backspace: true
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  text_color:
    light: "#ffffff"
    dark: "#e5e5e5"
  text_style:
    title_size: 2.8rem
    subtitle_size: 1.5rem
    line_height: 1.2
  social_links:
    enable: true
    style: default
    links:
      - icon: github
        url: https://github.com/Cheansnow
      - icon: instagram
        url: "#"
      - icon: email
        url: "#"
      - icon: fa-solid fa-robot
        url: "#"

navbar:
  auto_hide: true
  color:
    left: "#F5F4F1"
    right: "#DEDFF2"
    transparency: 35
  width:
    home: 1200px
    pages: 1100px
  search:
    enable: true
    preload: true
  links:
    首页:
      path: /
      icon: fa-regular fa-house
    文章:
      path: /archives
      icon: fa-regular fa-pen-nib
    分类:
      path: /categories
      icon: fa-regular fa-folder
    标签:
      path: /tags
      icon: fa-regular fa-tags

home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    announcement:
    show_on_mobile: true
  article_date_format: auto
  excerpt_length: 200
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3

articles:
  style:
    font_size: 16px
    line_height: 1.9
    image_border_radius: 12px
    image_alignment: center
    image_caption: true
    link_icon: true
    title_alignment: left
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: true
    auto: true
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: tokyo-night-dark
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: all_rights_reserved
  lazyload: true

footer:
  runtime: true
  start: 2026/07/29 00:00:00
  customize:
  statistics: true
  icp:
    enable: false

comment:
  enable: false

inject:
  enable: true
  head:
    - |
      <style id="opening-animation-override">
        .preloader {
          display: flex !important;
          background: #17181d !important;
          color: #fff !important;
          opacity: 1;
          transition: opacity .65s cubic-bezier(.22,.61,.36,1) !important;
        }
        .preloader .ml13 {
          color: #fff !important;
        }
        .home-banner-container,
        .home-banner-background {
          animation: banner-arrive 1.15s cubic-bezier(.22,.61,.36,1) both;
          animation-delay: 1.65s;
        }
        @keyframes banner-arrive {
          from { opacity: 0; filter: blur(8px); transform: scale(1.035); }
          to { opacity: 1; filter: blur(0); transform: scale(1); }
        }
      </style>
  footer:
    - |
      <script id="opening-animation-timing">
        (() => {
          const startedAt = performance.now();
          const originalHide = window.hidePreloader;
          if (typeof originalHide !== "function") return;
          window.hidePreloader = () => {
            const remaining = 2100 - (performance.now() - startedAt);
            if (remaining > 0) {
              window.setTimeout(originalHide, remaining);
            } else {
              originalHide();
            }
          };
        })();
      </script>

page_templates:
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

plugins:
  feed:
    enable: true
  aplayer:
    enable: false
